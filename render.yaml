# Free sample deployment. Private accounts stay disabled until durable storage is connected.
projects:
- name: NextMe
  environments:
  - name: Production
    services:
    - type: web
      name: NextMe
      runtime: node
      repo: https://github.com/babae19/NextMe-
      branch: render-free
      plan: free
      numInstances: 1
      autoDeployTrigger: checksPass
      buildCommand: npm ci --include=dev && npm run typecheck && npm run build
      startCommand: npm start
      healthCheckPath: /api/health
      envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/nextme-preview.sqlite
      - key: DEMO_ONLY
        value: 'true'

# Deployment target: NextMe / Production in Abdulai's workspace.
# Review the paid compute and persistent disk before applying.
projects:
- name: NextMe
  environments:
  - name: Production
    services:
    - type: web
      name: NextMe
      runtime: node
      repo: https://github.com/babae19/NextMe-
      branch: main
      plan: 0.5c-512mb
      numInstances: 1
      autoDeployTrigger: checksPass
      buildCommand: npm ci --include=dev && npm run typecheck && npm run build
      startCommand: npm start
      healthCheckPath: /api/health
      disk:
        name: nextme-data
        mountPath: /var/data/nextme
        sizeGB: 1
      envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/nextme/nextme.sqlite
      - key: AI_PROVIDER
        value: openai
      - key: AI_API_KEY
        sync: false
